# Fly.io config for portfolio-api. Change `app` to your Fly app name.
# Secrets (DATABASE_URL, JWT_SECRET, ADMIN_*, R2_*, REVALIDATE_SECRET,
# CORS_ORIGIN, ...) are set with `fly secrets set`, never here.
app = "portfolio-api"
primary_region = "sin" # Singapore — closest Fly region to Indonesia

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  MIGRATE_ON_BOOT = "true"
  STORAGE_DRIVER = "r2"
  # Fly's edge sets Fly-Client-IP on every request; used for rate limiting.
  TRUST_PROXY = "true"
  CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to stay within free allowances. Set
  # min_machines_running = 1 to avoid cold starts on the first request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
